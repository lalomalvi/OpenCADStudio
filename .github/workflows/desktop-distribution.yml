name: Fork desktop distribution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      publish_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'lalomalvi/OpenCADStudio'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Bundle icon dependency (CI only)
        if: runner.os == 'macOS'
        run: brew install librsvg
      - name: Diagnose and exercise boundaries
        run: |
          python scripts/desktop.py diagnose --logs target/desktop-logs/preflight
          python scripts/test_desktop.py
      - name: Validate release tag and source version
        if: inputs.publish_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: python scripts/release.py versions --tag "$RELEASE_TAG"
      - name: Build locked fork package
        run: python scripts/desktop.py build --output dist
      - name: Release preparation without external publication
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'scripts'
          python -m unittest test_release.ReleaseTests.test_empty_fork_can_prepare_first_release_without_publishing test_release.ReleaseTests.test_calendar_versions test_release.ReleaseTests.test_release_commit_push_and_retry test_release.ReleaseTests.test_fork_release_stays_draft_through_prepare_and_retry test_release.ReleaseTests.test_fork_refuses_inherited_tag_without_distribution
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation tests failed' }
      - name: Install outside checkout, test paths and MCP, render GUI
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist -Filter '*.zip')
          if ($packages.Count -ne 1) { throw 'Expected exactly one native fork ZIP' }
          $appDirectory = Join-Path $env:RUNNER_TEMP 'OCS per user application with spaces'
          python scripts/desktop.py install --package $packages[0].FullName --install-dir $appDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
          $env:OCS_TEST_PACKAGE = $packages[0].FullName
          python scripts/test_desktop.py
          if ($LASTEXITCODE -ne 0) { throw 'Distributed integration failed' }
          python scripts/desktop.py verify --install-dir $appDirectory --gui --cad
          if ($LASTEXITCODE -ne 0) { throw 'GUI verification failed' }
          python scripts/desktop.py path --install-dir $appDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Executable resolution failed' }
          if ($IsMacOS) {
            python scripts/desktop.py verify --install-dir $appDirectory --finder
            if ($LASTEXITCODE -ne 0) { throw 'Finder/LaunchServices opening failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.target }}
          # Never upload private profiles / automation descriptors (bridge tokens).
          path: |
            target/desktop-logs/**/summary.json
            target/desktop-logs/**/diagnosis.json
            target/desktop-logs/**/dynamic-libraries.json
            target/desktop-logs/**/gui-verification.json
            target/desktop-logs/**/report.json
            target/desktop-logs/**/*.log
            target/desktop-logs/**/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fork-package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: native
    if: inputs.publish_tag != '' && github.repository == 'lalomalvi/OpenCADStudio'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fork-package-*
          path: packages
          merge-multiple: true
      - name: Upload checked fork payloads to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish_tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" packages/* --repo "$REPOSITORY"
      - name: Verify actual uploaded fork assets, checksums and tag provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: python3 scripts/release.py verify-native --tag "$RELEASE_TAG" --allow-draft
      - name: Publish only after native gates and asset verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish_tag }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$REPOSITORY"
      - name: Confirm published fork distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish_tag }}
        run: python3 scripts/release.py verify-native --tag "$RELEASE_TAG"
