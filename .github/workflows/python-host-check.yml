name: Python host check

# Checks the scripting host API and the bundled Python plugin on Linux and Windows,
# where the plugin is loaded from `plugins/opencad.python` next to the executable.
# The plugin tests talk to a real plugin process over IPC. They are skipped, and
# report success, unless OCS_TEST_PYTHON_PLUGIN and OCS_PLUGIN_RUNNER_EXE are set,
# so this workflow sets both to the freshly built plugin and executable.

on:
  workflow_call:
  # Explicit standalone invocation is retained for troubleshooting only.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            library: libopencad_python.so
            exe: OpenCADStudio
          - name: windows
            os: windows-latest
            library: opencad_python.dll
            exe: OpenCADStudio.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: python-host-check
          workspaces: |
            .
            plugins/opencad-python

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - name: Plugin API tests
        run: cargo test --locked -p ocs_plugin_api --features host

      - name: Stage the bundled plugin
        run: bash plugins/opencad-python/tools/stage-bundled.sh "$PWD/work/plugin" --debug

      - name: Build the application (the plugin runner)
        # Debug rust-embed normally reads locales from the compile machine.
        # The downloaded Windows runner must instead carry them in the EXE.
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo build --locked --bin OpenCADStudio --features rust-embed/debug-embed
          else
            cargo build --locked --bin OpenCADStudio
          fi

      - name: Plugin crate tests
        working-directory: plugins/opencad-python
        run: cargo test --locked

      - name: Python model unit tests
        working-directory: plugins/opencad-python
        run: python3 -m unittest discover -s tests

      - name: Host tests over real IPC
        env:
          OCS_TEST_PYTHON_PLUGIN: ${{ github.workspace }}/work/plugin/${{ matrix.library }}
          OCS_PLUGIN_RUNNER_EXE: ${{ github.workspace }}/target/debug/${{ matrix.exe }}
        run: |
          test -f "$OCS_TEST_PYTHON_PLUGIN" || { echo "staged plugin missing: $OCS_TEST_PYTHON_PLUGIN"; exit 1; }
          test -f "$OCS_PLUGIN_RUNNER_EXE" || { echo "runner missing: $OCS_PLUGIN_RUNNER_EXE"; exit 1; }
          # Native Windows IO/printing changes need Windows unit coverage;
          # reuse the already compiled lib test binary, including live IPC.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo test --locked --lib -- --test-threads=1
          else
            cargo test --locked --lib -- --test-threads=1 python
          fi

      - name: Package the tested Windows runner (no rebuild)
        if: runner.os == 'Windows'
        run: python3 docs/automation/ci_runtime.py --out work/runner-windows

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: runner-windows
          path: work/runner-windows/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
