name: Tests

# One selection, one set of required checks, one explicit receipt.
# Prose never compiles Rust. Python-only automation runs Python tests.
# Native/infrastructure changes also run workspace + host platform coverage.

on:
  push:
    branches: [main, 'codex/mcp-*']
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Frozen comparison base (defaults to the event base/main)
        required: false
        type: string
      scope:
        description: auto selects by paths; full explicitly validates all scopes
        default: auto
        type: choice
        options: [auto, full]

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-22.04
    outputs:
      rust_workspace: ${{ steps.scope.outputs.rust_workspace }}
      python: ${{ steps.scope.outputs.python }}
      host: ${{ steps.scope.outputs.host }}
      reuse_run: ${{ steps.scope.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select scope and reuse verified checks
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ inputs.base_ref }}
          SCOPE: ${{ inputs.scope }}
        run: python docs/automation/ci_scope.py select --from-event --base "$BASE_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-selection
          path: target/ci-scope/selection.json
          if-no-files-found: error
          retention-days: 7

  test:
    needs: changes
    if: needs.changes.outputs.rust_workspace == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The same libraries the Linux release build needs (windowing, GL,
      # fonts); the packaging tools are left out.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # LC_ALL=C: a few tests compare English message text.
      - name: cargo test
        env:
          LC_ALL: C
        run: cargo test --workspace --locked

  masterplan-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image test dependency
        run: python -m pip install Pillow==12.1.0
      - name: Masterplan contract tests
        run: python -m unittest discover -s docs/automation/masterplan -p 'test_*.py' -q
      - name: Automation tests
        run: python -m unittest discover -s docs/automation -p 'test_*.py' -q

  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/python-host-check.yml

  sync-verification:
    needs: [changes, test, masterplan-python, host]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: ci-selection
          path: target/ci-scope
      - name: Verify required results (skipped jobs are not test passes)
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python docs/automation/ci_scope.py finalize
      - uses: actions/upload-artifact@v4
        with:
          name: sync-evidence
          path: target/ci-scope/verification.json
          if-no-files-found: error
          retention-days: 30
